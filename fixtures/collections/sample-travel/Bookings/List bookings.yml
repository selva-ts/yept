info:
  name: List bookings
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/bookings?status=all"
  params:
    - name: status
      value: all
      type: query
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", function () {
          expect(res.status).to.equal(200);
        });
        test("has bookings", function () {
          expect(res.body.items).to.have.length.above(0);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
