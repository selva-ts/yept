name: VS Code extension pre-release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the pre-release to the Marketplace and Open VSX (otherwise only build, test and keep the VSIX).
        required: true
        type: boolean
        default: false
  push:
    tags:
      - 'vscode-v*'

permissions:
  contents: read

concurrency:
  group: vscode-prerelease-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'
  NODE_USE_SYSTEM_CA: '1'
  VSCE_VERSION: '4.0.0'
  OVSX_VERSION: '1.3.0'
  VSIX: apps/vscode/out/yept-vscode.vsix

jobs:
  prerelease:
    name: Build, test and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Check the tag matches the extension version
        if: ${{ github.event_name == 'push' }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./apps/vscode/package.json').version")"
          if [ "$TAG" != "vscode-v$version" ]; then
            echo "::error::Tag $TAG doesn't match the extension version $version (expected vscode-v$version)."
            exit 1
          fi

      - name: Install locked dependencies
        run: |
          mkdir -p out/ci
          node --version
          npm --version
          npm ci 2>&1 | tee out/ci/install.log
          npx --no-install install-electron 2>&1 | tee out/ci/electron.log

      - name: Typecheck
        run: npm run typecheck 2>&1 | tee out/ci/typecheck.log

      - name: Unit tests
        run: npm test -- --maxWorkers=1 2>&1 | tee out/ci/unit.log

      - name: Extension tests
        # The extension tests start VS Code, which needs a display on Linux.
        run: xvfb-run -a npm test --workspace yept-vscode 2>&1 | tee out/ci/extension.log

      - name: Package pre-release VSIX
        working-directory: apps/vscode
        run: npx --yes "@vscode/vsce@${VSCE_VERSION}" package --pre-release --no-dependencies --out out/yept-vscode.vsix 2>&1 | tee ../../out/ci/package.log

      - name: Retain VSIX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yept-vscode-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.VSIX }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # Publishing runs on a vscode-v* tag, or by hand with "publish" ticked. Each registry is skipped when its token
      # isn't set. The tokens are given only to the step that uses them.
      - name: Publish to the Visual Studio Marketplace
        if: ${{ github.event_name == 'push' || inputs.publish }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::notice::VSCE_PAT isn't set; skipping the Marketplace."
            exit 0
          fi
          npx --yes "@vscode/vsce@${VSCE_VERSION}" publish --pre-release --packagePath "$VSIX"

      - name: Publish to Open VSX
        if: ${{ github.event_name == 'push' || inputs.publish }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::notice::OVSX_PAT isn't set; skipping Open VSX."
            exit 0
          fi
          npx --yes "ovsx@${OVSX_VERSION}" publish "$VSIX" --pre-release

      - name: Retain diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscode-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/ci/
          if-no-files-found: warn
          retention-days: 7
