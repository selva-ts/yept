name: Approved tag packages

on:
  workflow_dispatch:
    inputs:
      approve-build:
        description: I approve a package build of this existing version tag on main.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: approved-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify approved version tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out tag and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify approval, tag version and main ancestry
        env:
          RELEASE_APPROVED: ${{ inputs.approve-build }}
        run: node scripts/ci.mjs release

  packages:
    needs: verify
    if: ${{ inputs.approve-build && startsWith(github.ref, 'refs/tags/v') }}
    uses: ./.github/workflows/ci.yml
    with:
      upload-packages: true
