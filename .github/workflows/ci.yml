name: Desktop validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      upload-packages:
        description: Retain packages from a manually approved version-tag build.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  CI: 'true'
  NODE_USE_SYSTEM_CA: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  desktop:
    name: Desktop ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
            platform: win
            arch: x64
          - name: macOS arm64
            runner: macos-15
            platform: mac
            arch: arm64
          - name: macOS x64
            runner: macos-15-intel
            platform: mac
            arch: x64
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: |
          mkdir -p out/ci
          node --version
          npm --version
          npm ci 2>&1 | tee out/ci/install.log
          npx --no-install install-electron 2>&1 | tee out/ci/electron.log

      - name: Typecheck
        run: npm run typecheck 2>&1 | tee out/ci/typecheck.log

      - name: Unit tests
        run: npm test -- --maxWorkers=1 2>&1 | tee out/ci/unit.log

      - name: Licence check
        run: npm run check:licenses 2>&1 | tee out/ci/licenses.log

      - name: Set up .NET for Windows E2E
        if: matrix.platform == 'win'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Prepare Windows HTTPS fixture
        if: matrix.platform == 'win'
        shell: pwsh
        timeout-minutes: 5
        run: |
          dotnet build samples/SampleApi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $fixtureCertificate = Join-Path $env:RUNNER_TEMP 'yept-fixture.cer'
          dotnet dev-certs https --export-path $fixtureCertificate --format PEM
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The machine store avoids the per-user root trust prompt on hosted Windows.
          certutil -addstore -f Root $fixtureCertificate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/ci.mjs fixture $fixtureCertificate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Windows E2E
        if: matrix.platform == 'win'
        run: npm run e2e 2>&1 | tee out/ci/e2e.log

      - name: Package desktop app
        run: npm run package:${{ matrix.platform }} -- --${{ matrix.arch }} --publish never 2>&1 | tee out/ci/package.log

      - name: Check Windows package
        if: matrix.platform == 'win'
        run: node scripts/ci.mjs package

      - name: Retain diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/ci/
          if-no-files-found: warn
          retention-days: 7

      - name: Retain Windows failure screenshots
        if: ${{ failure() && matrix.platform == 'win' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e/out/*.png
          if-no-files-found: ignore
          retention-days: 3

      - name: Retain approved tag packages
        if: ${{ inputs.upload-packages && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.ref_name }}-${{ github.run_attempt }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            build/THIRD_PARTY_NOTICES.txt
            LICENSE
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
