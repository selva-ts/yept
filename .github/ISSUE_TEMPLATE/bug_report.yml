name: Bug report
description: Report a reproducible problem using synthetic data. Email vulnerabilities privately.
body:
  - type: markdown
    attributes:
      value: |
        Do not post vulnerabilities, tokens, real collections, internal hostnames or customer data here.
        For security reports, email selva_subramaniam@outlook.com privately.
  - type: input
    id: version
    attributes:
      label: Yept version or commit
      description: Find the version in About. Include the commit if built from source.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
      placeholder: Windows 11 x64
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use a minimal synthetic collection or the fixture server. Include build/install steps when relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitised logs or screenshots
      description: Inspect every attachment for secrets, private paths and response data. Describe any workaround.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I checked that this report and its attachments contain only synthetic or sanitised data.
          required: true
